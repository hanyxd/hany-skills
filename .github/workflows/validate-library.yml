name: Validate library
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check generated docs match disk
        run: |
          python3 scripts/gen-catalog.py
          python3 scripts/gen-docs.py
          git diff --exit-code docs/CATALOG.md docs/index.html \
            || { echo "docs are stale. Run scripts/gen-catalog.py and scripts/gen-docs.py and commit the updates."; exit 1; }
      - name: Run structural validator
        run: python3 scripts/validate-skills.py
      - name: Installer must pass a dry-run of every install mode
        run: |
          ./install.sh -n --curated >/dev/null || { echo "install.sh --curated dry-run failed"; exit 1; }
          ./install.sh -n --all >/dev/null || { echo "install.sh --all dry-run failed"; exit 1; }
          ./install.sh list >/dev/null || { echo "install.sh list failed"; exit 1; }